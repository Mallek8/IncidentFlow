services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: incidentflow-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_Password123}"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD:-Your_strong_Password123}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/IncidentFlow.API/Dockerfile
    container_name: incidentflow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IncidentFlowDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_Password123};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "${JWT_KEY:-DEV_ONLY_IncidentFlow_Jwt_Signing_Key_Change_In_Production_32+}"
      Cors__AllowedOrigins__0: "http://localhost:5188"
      Cors__AllowedOrigins__1: "http://localhost:8081"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: incidentflow-web
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  sql_data:
